[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ancient-dna-analyzer"
version = "2.0.0"
description = "AI-powered ancient DNA sequence analysis toolkit with genome engineering tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "rudra0812"}
]
keywords = ["bioinformatics", "dna", "genomics", "ancient-dna", "paleogenomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "ollama>=0.1.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/rudra0812/ancient-dna-analyzer"
Repository = "https://github.com/rudra0812/ancient-dna-analyzer"
Issues = "https://github.com/rudra0812/ancient-dna-analyzer/issues"

[project.scripts]
ancient-dna = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
